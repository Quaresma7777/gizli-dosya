<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Öğretmenler Günü Sürprizi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9ecb, #ffb3d9, #ffd6e8);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 30px;
            margin: 0;
            overflow: hidden;
        }
        #container {
            background: #ffe6f2;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.3);
            width: 95%;
            max-width: 420px;
            text-align: center;
            margin-bottom: 40px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        #evetBtn {
            background: #4caf50;
            color: white;
        }
        #hayirBtn {
            background: #e53935;
            color: white;
        }
        .heart {
            position: fixed;
            bottom: -10px;
            color: #ff4d88;
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            opacity: 0.8;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="container">
        <h2>Adınızı giriniz</h2>
        <input type="text" id="isim" placeholder="Adınız" style="padding:10px; width:80%; border-radius:10px; border:1px solid #ccc;">
        <br><br>
        <button onclick="baslat()">Devam Et</button>
    </div>

    <script>
        let hayirSayisi = 0;
        let kullaniciIsmi = "";

        function baslat() {
            const isimInput = document.getElementById("isim");
            if (isimInput.value.trim() === "") {
                alert("Lütfen adınızı giriniz.");
                return;
            }
            kullaniciIsmi = isimInput.value;
            soruEkrani();
        }

        function soruEkrani() {
            document.getElementById("container").innerHTML = `
                <h2>Size bir sürprizimiz var, görmek ister misiniz?</h2>
                <button id="evetBtn" onclick="sonPanel()">Evet</button>
                <button id="hayirBtn" onclick="hayirTiklama()">Hayır</button>
            `;
        }

        function hayirTiklama() {
            hayirSayisi++;

            const sorular = [
                "Emin misin? Sürprizler güzeldir 😊",
                "Gerçekten mi? Belki hoşuna gider!",
                "Bir şans daha vermek ister misin?",
                "Bak pişman olabilirsin, sürpriz çok güzel 😄",
                "Son kararın mı?",
                "Hiç mi merak etmedin? 🤔"
            ];

            let soru = sorular[hayirSayisi % sorular.length];

            let yeniBoyut = 16 + hayirSayisi * 8;
            let yeniPadding = 10 + hayirSayisi * 3;

            document.getElementById("container").innerHTML = `
                <h2>${soru}</h2>
                <button id="evetBtn" onclick="sonPanel()" style="font-size:${yeniBoyut}px; padding:${yeniPadding}px; background:#4caf50; color:white; border:none; border-radius:10px;">Evet</button>
                <button id="hayirBtn" onclick="hayirTiklama()" style="background:#e53935; color:white; border:none; border-radius:10px; padding:10px 20px;">Hayır</button>
            `;
        }

        function sonPanel() {
            document.getElementById("container").innerHTML = `
                <h1>Öğretmenler Gününüz Kutlu Olsun ${kullaniciIsmi} Hocam! 🎉</h1>
                <p>İyi ki varsınız hocam.</p>
                <h3 style="margin-top:20px; color:#d63384; font-weight:bold;">
                    “Öğretmenler; yeni nesli, Cumhuriyetin fedakâr öğretmen ve eğitimcilerini, sizler yetiştireceksiniz ve yeni nesil, sizin eseriniz olacaktır.”
                </h3>
                <p style="font-size:18px; color:#222; margin-top:15px; font-family:'Brush Script MT', cursive;">
                    — Mustafa Kemal Atatürk
                </p>
                <h3 style="margin-top:25px; color:#ff3366; font-weight:bold;">
                    Sizi çok seviyor ve emeğiniz için minnettarız. 
                    Öğretmenler Gününüz kutlu olsun! 💖
                </h3>
            `;
            generateHearts();
        }

        function generateHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '💗';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (20 + Math.random() * 20) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 4000);
            }, 300);
        }
    </script>

    <div style="position: fixed; bottom: 10px; right: 10px; color:#3b3b3b; font-weight: bold; opacity:0.8;">
        Developed by Metehan Balcı
    </div>
</body>
</html>
